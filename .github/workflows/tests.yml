name: Tests

on:
  pull_request:
    paths-ignore:
      - 'wordpress-plugin/**'
  push:
    branches: [main]
    paths-ignore:
      - 'wordpress-plugin/**'

permissions:
  contents: read

# Third-party actions are pinned to a full commit SHA, with the version in a trailing comment.
# A mutable tag like `@v2` is re-pointable by its owner, so a compromised or coerced upstream
# release would execute here on the next run with no change on our side. GitHub-owned actions
# (actions/*, github/*) stay on tags — they ship as immutable releases, which is why CodeQL's
# actions/unpinned-tag rule flags only the third-party one. That rule found this.
#
# The trade-off is staleness: a pinned SHA never updates itself. .github/dependabot.yml handles
# that — its github-actions ecosystem raises a weekly grouped PR and rewrites both the SHA and the
# trailing version comment. Merging that PR is the intended way to bump these.

jobs:
  pint:
    name: Pint (code style)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: '8.4'
          tools: composer
          coverage: none
      # bootstrap/cache is gitignored, so it's absent on a fresh checkout;
      # composer's post-autoload-dump (package:discover) needs it to exist.
      - name: Create runtime directories
        run: mkdir -p bootstrap/cache
      # package:discover boots the app, which reads AWS_* config; without .env
      # those are null and S3Service's typed string props fail to construct.
      - name: Copy environment file
        run: cp .env.example .env
      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-progress
      - name: Check code style
        run: ./vendor/bin/pint --test

  # Static analysis of the PHP that actually runs — see specs/features/static-analysis.md.
  # Cloned from the pint job, not phpunit: PHPStan needs the autoloader and nothing else, so no
  # node, no asset build and no app key. Level 2 with no baseline, so this is 0-or-fail.
  phpstan:
    name: PHPStan (Larastan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: '8.4'
          tools: composer
          coverage: none
      # bootstrap/cache is gitignored, so it's absent on a fresh checkout;
      # composer's post-autoload-dump (package:discover) needs it to exist.
      - name: Create runtime directories
        run: mkdir -p bootstrap/cache
      # package:discover boots the app, which reads AWS_* config; without .env
      # those are null and S3Service's typed string props fail to construct.
      - name: Copy environment file
        run: cp .env.example .env
      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-progress
      - name: Analyse
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G

  phpunit:
    name: PHPUnit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: '8.4'
          extensions: mbstring, gd, exif, zip, bcmath, intl, pdo_sqlite, sqlite3
          coverage: pcov
          tools: composer
      # These runtime dirs are gitignored, so they're absent on a fresh checkout:
      # bootstrap/cache (package:discover), storage/framework/views (Blade compile),
      # storage/logs (logging). Create them before composer install + tests run.
      - name: Create runtime directories
        run: mkdir -p bootstrap/cache storage/framework/{cache,sessions,views,testing} storage/logs
      # package:discover boots the app, which reads AWS_* config; without .env
      # those are null and S3Service's typed string props fail to construct.
      - name: Copy environment file
        run: cp .env.example .env
      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-progress
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install Node dependencies
        run: npm ci
      # Feature tests render Blade views containing @vite, which throws without a build manifest.
      - name: Build front-end assets
        run: npm run build
      # .env was copied before composer install; key:generate just needs vendor/.
      - name: Generate application key
        run: php artisan key:generate
      # Tests use the in-memory SQLite + array drivers configured in phpunit.xml.
      # --coverage prints the per-file summary (pcov). Once a baseline is known,
      # add --min=NN here to enforce a coverage floor.
      - name: Run tests
        run: |
          php artisan config:clear
          php artisan test --coverage

  # The Security suite also runs inside the phpunit job above (a plain `artisan test` runs every
  # suite). It gets its own job so a security regression is a distinct, separately required
  # status check rather than one line in a 1120-test run. See specs/features/security-invariants.md.
  security:
    name: Security invariants
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: '8.4'
          extensions: mbstring, gd, exif, zip, bcmath, intl, pdo_sqlite, sqlite3
          coverage: none
          tools: composer
      - name: Create runtime directories
        run: mkdir -p bootstrap/cache storage/framework/{cache,sessions,views,testing} storage/logs
      - name: Copy environment file
        run: cp .env.example .env
      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-progress
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install Node dependencies
        run: npm ci
      # RouteExposureTest's guest sweep issues real requests to every guarded page, which renders
      # Blade layouts containing @vite — that throws without a build manifest.
      - name: Build front-end assets
        run: npm run build
      - name: Generate application key
        run: php artisan key:generate
      - name: Run security invariants
        run: |
          php artisan config:clear
          php artisan test --testsuite=Security
      # Known advisories in dependencies. Neither carries an ignore list: when one fires, patch it,
      # or add an explicit commented --ignore for that specific advisory. Do not append `|| true` —
      # that makes the step decorative.
      #
      # This is not theoretical. On its first run it failed on two Guzzle advisories
      # (CVE-2026-69245/69246) published hours after a local run had reported clean, which is the
      # whole argument for it running again tomorrow rather than once.
      - name: Audit Composer dependencies
        run: composer audit --locked
      - name: Audit npm dependencies
        run: npm audit --audit-level=high

  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: '8.4'
          extensions: mbstring, gd, exif, zip, bcmath, intl, pdo_sqlite, sqlite3
          coverage: none
          tools: composer
      # Same gitignored runtime dirs as the phpunit job. .env.e2e uses the *file*
      # session driver (specs/features/e2e-testing.md REQ-5), so
      # storage/framework/sessions must exist before the app serves a request.
      - name: Create runtime directories
        run: mkdir -p bootstrap/cache storage/framework/{cache,sessions,views} storage/logs storage/e2e
      # package:discover boots the app and reads AWS_* config. The suite itself
      # runs against .env.e2e (committed); this .env only satisfies composer.
      - name: Copy environment file
        run: cp .env.example .env
      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-progress
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install Node dependencies
        run: npm ci
      # The Blade layouts use @vite, which throws without a build manifest.
      - name: Build front-end assets
        run: npm run build
      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          # Fall back to the previous browser cache when the lockfile changes for
          # any other reason: `playwright install` then only tops up what's stale
          # instead of re-downloading Chromium.
          restore-keys: |
            playwright-${{ runner.os }}-
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      # MinIO stands in for S3 (ADR-014). A service container can't override the
      # image's command (`server /data`), so it runs as a plain docker step.
      # Credentials/bucket mirror .env.e2e — nothing here is a secret.
      - name: Start MinIO
        run: |
          docker run -d --name minio-e2e \
            -p 9000:9000 \
            -e MINIO_ROOT_USER=orca-e2e \
            -e MINIO_ROOT_PASSWORD=orca-e2e-secret \
            minio/minio:RELEASE.2025-04-22T22-12-26Z server /data
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:9000/minio/health/live && break
            sleep 2
          done
      # Public read: the browser fetches asset/thumbnail URLs straight from the
      # bucket, exactly as it would from S3 behind the CDN.
      - name: Create the bucket
        env:
          AWS_ACCESS_KEY_ID: orca-e2e
          AWS_SECRET_ACCESS_KEY: orca-e2e-secret
          AWS_DEFAULT_REGION: us-east-1
        run: |
          aws --endpoint-url http://127.0.0.1:9000 s3 mb s3://orca-e2e
          aws --endpoint-url http://127.0.0.1:9000 s3api put-bucket-policy \
            --bucket orca-e2e \
            --policy '{"Version":"2012-10-17","Statement":[{"Effect":"Allow","Principal":"*","Action":["s3:GetObject"],"Resource":["arn:aws:s3:::orca-e2e/*"]}]}'
      # Playwright boots `artisan serve --env=e2e` itself and reseeds the fixtures.
      - name: Run Playwright
        run: npm run test:e2e
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7
      - name: Laravel log on failure
        if: failure()
        run: tail -n 200 storage/logs/laravel.log || true
