# ORCA-specific Semgrep rules — see specs/features/static-analysis.md (layer B).
#
# These deliberately restate invariants that tests/Security/ already checks. The difference is
# how: tests/Security/Support/SourceScanner.php matches text, and says so in its own docblock
# ("A source scan is a blunt instrument — it sees text, not semantics, and cannot follow a
# variable or a helper"). These rules match the parse tree, so a call spelled across three lines,
# or with its arguments in a different order, is still the same call — and a call inside a comment
# or a string literal is not one.
#
# The duplication is intentional and temporary. Both must catch the same defect (asserted by the
# mutation table in the spec); once these rules have proven themselves in CI, the corresponding
# text scans can be retired rather than maintained in parallel.
#
# Every rule has a fixture under .semgrep/tests/ and is verified by `semgrep --test` in CI
# *before* the scan runs, so a broken rule fails as "the rules are wrong" rather than silently
# matching nothing and reporting a clean codebase.
#
# No rule carries a `paths:` filter. Scope comes from the targets passed on the command line
# (see the security job in .github/workflows/tests.yml), because a `paths.include` would also
# exclude .semgrep/tests/ and make `--test` vacuously green.

rules:
  # ── specs/features/authentication.md REQ-8 ──────────────────────────────────
  #
  # The registration incident was not User::create being called; it was User::create being called
  # with no role, letting the column default fill in `editor`. The column default is gone, so an
  # omitted role now fails at the driver — but a call site that never names the role is still a
  # call site whose privileges nobody decided.
  - id: orca-user-create-without-role
    languages: [php]
    severity: ERROR
    message: >-
      This creates a User without naming a role. Every creation path must state the privileges it
      grants explicitly — see specs/features/authentication.md REQ-8 and
      specs/features/security-invariants.md REQ-4. Add 'role' => '…', or use an explicit factory
      state (->admin() / ->editor() / ->apiUser()).
    patterns:
      - pattern-either:
          - pattern: User::create($ARGS)
          - pattern: User::firstOrCreate($ARGS)
          - pattern: User::updateOrCreate($ARGS)
          - pattern: User::firstOrCreate($FIND, $ARGS)
          - pattern: User::updateOrCreate($FIND, $ARGS)
      # The attributes array is inspected as text while the *call* is AST-matched. That split is
      # deliberate: AST matching is what rules out a `User::create(` inside a comment or a string,
      # and the regex keeps the key check tolerant of formatting, nesting and trailing commas.
      - metavariable-regex:
          metavariable: $ARGS
          regex: '(?s)^(?![\s\S]*[''"]role[''"])[\s\S]*$'

  # ── specs/features/security-invariants.md REQ-6 ─────────────────────────────
  #
  # `role` is mass-assignable on User because the admin user form assigns it, so any write that
  # takes the caller's whole payload is a privilege-escalation path.
  - id: orca-unfiltered-mass-assignment
    languages: [php]
    severity: ERROR
    message: >-
      A model write is being handed the caller's entire request payload. User::$fillable includes
      'role', so on a User this assigns whatever was posted. Validate first and assign
      $request->validated(), or list the fields explicitly. See
      specs/features/security-invariants.md REQ-6.
    pattern-either:
      - pattern: $MODEL->fill($REQ->all())
      - pattern: $MODEL->update($REQ->all())
      - pattern: $MODEL->forceFill($REQ->all())
      - pattern: $MODEL->fill(request()->all())
      - pattern: $MODEL->update(request()->all())
      - pattern: $MODEL->fill($REQ->except(...))
      - pattern: $MODEL->update($REQ->except(...))

  # ── ADR-002 / specs/features/authorization-policies.md REQ-1 ────────────────
  #
  # PolicyMatrixTest also detects this, by slicing the method body out of the file by line number.
  # Expressed as a parse-tree pattern, an ability whose body is `return true;` written across two
  # lines, or with a comment inside it, is still caught.
  #
  # Scoped by class name rather than by directory, so a policy placed outside app/Policies is
  # covered too — and so the three FormRequests whose `authorize()` legitimately returns true
  # (LoginRequest, StoreAssetRequest, UpdateAssetRequest) are not flagged.
  - id: orca-policy-blanket-grant
    languages: [php]
    severity: ERROR
    message: >-
      This policy ability grants unconditionally. ADR-002 requires every ability to enumerate the
      roles it allows, so that adding a role means opting it into each ability rather than
      inheriting all of them.
    patterns:
      - pattern-inside: |
          class $CLASS { ... }
      - metavariable-regex:
          metavariable: $CLASS
          regex: '.*Policy$'
      - pattern: |
          public function $ABILITY(...)
          {
            return true;
          }

  # ── Forward-looking: no raw SQL built from a variable ───────────────────────
  #
  # There are zero DB::raw calls in app/ today. This rule exists so that the first one has to be
  # a literal, rather than being noticed after it ships.
  - id: orca-db-raw-from-variable
    languages: [php]
    severity: ERROR
    message: >-
      DB::raw() is being given a non-literal expression. Raw SQL assembled from a variable is an
      injection sink; use bindings, or a query-builder method, instead.
    patterns:
      - pattern: DB::raw($EXPR)
      - pattern-not: DB::raw("...")
      - pattern-not: DB::raw('...')
