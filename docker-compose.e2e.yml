# MinIO standing in for S3 during the Playwright E2E suite
# (specs/features/e2e-testing.md — ADR-014). `npm run e2e:up` / `e2e:down`.
#
# Credentials and bucket name mirror .env.e2e. Nothing here is reachable from
# outside localhost and nothing in it is a secret.

services:
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: orca-e2e
      MINIO_ROOT_PASSWORD: orca-e2e-secret
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - minio-e2e:/data

  # Creates the bucket and makes it anonymously readable — the browser loads
  # asset/thumbnail URLs straight from AWS_URL, so public read is required.
  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set e2e http://minio:9000 orca-e2e orca-e2e-secret &&
      mc mb --ignore-existing e2e/orca-e2e &&
      mc anonymous set download e2e/orca-e2e
      "

volumes:
  minio-e2e:
