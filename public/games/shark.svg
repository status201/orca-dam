<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 52" width="120" height="52">
  <!-- Geometry notes for anyone editing this:
       - Faces left (head at low x) like every other entity; they all move right-to-left.
       - viewBox is 120x52, matching the .game-shark CSS box, so 1 unit == 1 px and the
         jaw's CSS transform-origin (30,26 -> see orca-game.css) is literal.
       - The mouth is a notch cut out of the body: the body's front-bottom edge stops at the
         upper jaw line, and the cavity + hinged chin fill the gap. Nothing strokes the throat
         edge, so the chin reads as continuous with the belly instead of a pasted-on slab.
       - The chin must stay thicker than r*sin(gape) so it hides the cavity when closed.
         At r~26 and a 16deg gape that is ~7.2 units. Widening the gape means fattening the chin. -->

  <!-- Tail fin — asymmetric crescent, large upper lobe -->
  <path d="M93,23 Q91,13 105,1 Q99,14 100,23 Q99,31 106,41 Q91,32 93,23 Z" fill="#4a6884" stroke="#33506d" stroke-width="0.7" stroke-linejoin="round"/>

  <!-- Body fill — unstroked; the outline is a separate open path that skips the throat notch -->
  <path d="M3,19
           Q4,11 15,8
           Q30,4 47,6.5
           Q69,9 87,17
           L96,23
           L87,29
           Q70,36 50,37.5
           Q38,38 33,33
           L31,26
           Q18,32 5,23.5
           Q3.2,22.5 3,19 Z" fill="#5c7994"/>

  <!-- Dark back -->
  <path d="M6,15 Q18,8 40,7 Q68,8.5 88,17.5 L96,23 Q72,13 44,11 Q20,10 6,15 Z" fill="#46617e" opacity="0.55"/>
  <!-- Dorsal ridge highlight — kept soft; a hard streak reads as a crease on the head -->
  <path d="M8,15.5 Q19,9.5 38,8.8 Q24,11.8 14,16 Z" fill="#7d97ae" opacity="0.2"/>

  <!-- Mouth cavity — its top edge IS the upper jaw line, so no stroke is needed there -->
  <path d="M5,23.5 Q18,32 31,26 L32.5,30 Q19,38.5 5.5,33.5 Z" fill="#3a1116"/>
  <!-- Gullet -->
  <path d="M9,30 Q18,35 28,30.5 Q18,33.5 9,31.6 Z" fill="#6b1f28" opacity="0.8"/>

  <!-- Upper teeth — roots on the jaw line, tips shortest at the mouth corner -->
  <path d="M5,23.5 L7.6,27.3 L10.2,25.3 L12.8,30.3 L15.4,27 L18,31.6 L20.6,27.5 L23.2,31.1 L25.8,26.8 L28.4,28.6 L31,26 Q18,32 5,23.5 Z"
        fill="#fdfdfb" stroke="#c9cfd6" stroke-width="0.3" stroke-linejoin="round"/>

  <!-- === LOWER JAW — hinged at (31,26); see orca-game.css .shark-jaw === -->
  <g class="shark-jaw">
    <!-- Chin fill, unstroked: its rear tucks under the belly countershade drawn after it -->
    <path d="M31,26 Q18,34.5 5,26.5 Q2.0,28.4 3.2,32 Q4.6,36.4 16,36.8 Q28,36.6 36,32 Z" fill="#e6ded2"/>
    <!-- Chin outline — front and underside only -->
    <path d="M5,26.5 Q2.0,28.4 3.2,32 Q4.6,36.4 16,36.8 Q28,36.6 36,32" fill="none" stroke="#33506d" stroke-width="0.6" stroke-linejoin="round" stroke-linecap="round"/>
    <!-- Dark gum band: the lower teeth need to read as white-on-dark, not white-on-cream -->
    <path d="M5,26.5 Q18,34.5 31,26 L31,27.6 Q18,38 5.5,29 Z" fill="#3a1116"/>
    <!-- Lower teeth — interlock with the upper row through the closed mouth -->
    <path d="M5,26.5 L7.6,25.7 L10.2,29 L12.8,26.8 L15.4,30.2 L18,27.2 L20.6,30.2 L23.2,26.8 L25.8,28.7 L28.4,26 L31,26 Q18,34.5 5,26.5 Z"
          fill="#fdfdfb" stroke="#c9cfd6" stroke-width="0.3" stroke-linejoin="round"/>
  </g>

  <!-- Countershade belly — same cream as the chin, and drawn after it so the jaw's rear
       tab disappears under it at every point in the chomp -->
  <path d="M31,26 Q36,29 46,29.5 Q64,31 82,26 L96,23 L87,29 Q70,36 50,37.5 Q38,38 33,33 Z" fill="#e6ded2"/>
  <path d="M32,28.5 Q37,30.5 46,31 Q64,32.5 82,27.5 L96,23 Q78,30 56,32.6 Q40,33.6 32,30.8 Z" fill="#cfc5b6" opacity="0.5"/>

  <!-- Body outline — open path: starts at the mouth corner, skips the throat notch entirely -->
  <path d="M5,23.5 Q3.2,22.5 3,19 Q4,11 15,8 Q30,4 47,6.5 Q69,9 87,17 L96,23 L87,29 Q70,36 50,37.5 Q38,38 33,33"
        fill="none" stroke="#33506d" stroke-width="0.9" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- Dorsal fin — large, swept back, concave trailing edge -->
  <path d="M42,7.5 Q46,1.5 56,0.6 Q55,5.5 63,10.5 Z" fill="#4a6884" stroke="#33506d" stroke-width="0.8" stroke-linejoin="round"/>
  <!-- Second dorsal -->
  <path d="M72,13.5 Q76,8.5 79,8 Q78,11.5 80,14.8 Z" fill="#4a6884" stroke="#33506d" stroke-width="0.5" stroke-linejoin="round"/>
  <!-- Anal fin -->
  <path d="M70,34.5 Q68,39.5 66,41.5 Q72,39 77,35 Z" fill="#4a6884" stroke="#33506d" stroke-width="0.5" stroke-linejoin="round"/>

  <!-- Gill slits -->
  <path d="M36,13 Q33.5,21 36,29" fill="none" stroke="#33506d" stroke-width="0.9" opacity="0.5"/>
  <path d="M39.5,12.3 Q37,20.8 39.5,29.6" fill="none" stroke="#33506d" stroke-width="0.85" opacity="0.45"/>
  <path d="M43,11.9 Q40.5,20.6 43,30" fill="none" stroke="#33506d" stroke-width="0.8" opacity="0.4"/>
  <path d="M46.5,11.8 Q44,20.6 46.5,30.2" fill="none" stroke="#33506d" stroke-width="0.75" opacity="0.34"/>
  <path d="M50,12 Q47.5,20.8 50,30.2" fill="none" stroke="#33506d" stroke-width="0.7" opacity="0.28"/>

  <!-- Pectoral fin — long, swept down and back -->
  <path d="M33,31.5 Q28,39.5 24,45.5 Q36,41.5 44,33 Z" fill="#4a6884" stroke="#33506d" stroke-width="0.6" stroke-linejoin="round"/>

  <!-- Eye — beady, solid black -->
  <circle cx="16" cy="17" r="2.4" fill="#141820"/>
  <circle cx="16.8" cy="15.9" r="0.6" fill="#ffffff" opacity="0.7"/>
</svg>
